[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cyberfilm"
version = "0.1.0"
description = "An observability-driven AI production supervisor"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Ecosystem Network" }]
dependencies = [
  "google-adk[mcp]==2.6.3",
  "google-cloud-aiplatform[adk,agent_engines]==1.163.0",
  "google-genai==2.18.1",
  "pydantic==2.12.5",
  "parallel-web==1.1.0",
  "clickhouse-connect[async]==1.6.0",
  "httpx==0.28.1",
  "ibm-watsonx-gov[metrics]==1.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cyberfilm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
